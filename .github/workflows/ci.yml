name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"      # weekly: new releases of the dependencies
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
        include:      # the other supported versions, on Linux
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.14"}
    runs-on: ${{ matrix.os }}
    env:
      PDFOPT_REQUIRE_ECT: "1"   # a failed build of the ECT module fails the job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # ffmpeg only for the test that checks our SSIM against its ssim filter
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils libopenjp2-tools ghostscript ffmpeg
      # jbig2enc (package "jbig2"); its tests are skipped where it is missing
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y jbig2 || echo "jbig2enc is not available"
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y build-essential python3-dev
      - if: runner.os == 'macOS'
        run: brew install poppler ghostscript openjpeg ffmpeg
      - if: runner.os == 'Windows'
        run: choco install -y poppler ghostscript ffmpeg
      - run: pip install -e '.[dev]'
      - run: python -c "import pdfopt._ectdeflate"
      - run: ruff check .
      - run: mypy
      - run: pytest -q
      # sdist, then a wheel built from it: catches files missing from MANIFEST.in
      - run: pip install build && python -m build
