name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils libjpeg-turbo-progs jbig2enc-tools ffmpeg
      - run: sudo apt-get install -y build-essential python3-dev
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
