[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfopt"
version = "0.2.0"
description = "PDF optimizer: lossless recompression, JPEG re-encoding and layered MRC for scans"
readme = "README.md"
requires-python = ">=3.11"
# pdfopt itself is MIT; the bundled ECT and Zopfli are Apache 2.0 (THIRD_PARTY_NOTICES).
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES", "pdfopt/_ect/License.txt",
                 "pdfopt/_ect/zopfli/COPYING"]
dependencies = [
    "pikepdf>=9,<11",
    "pypdf>=5,<7",
    "Pillow>=10,<13",
    "numpy>=1.26,<3",
]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
pdfopt = "pdfopt.cli:main"

[tool.setuptools]
# MANIFEST.in puts the ECT sources into the sdist; the wheel only needs the
# built module (the licenses go to dist-info via license-files).
include-package-data = false

[tool.setuptools.packages.find]
include = ["pdfopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108", "B905"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
